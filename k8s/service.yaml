# ClusterIP Service: in-cluster only. The landing page is reached initially with
#   kubectl -n erudition port-forward svc/erudition-landing 8080:80
# then browse http://localhost:8080. No Ingress or public LoadBalancer is created.
apiVersion: v1
kind: Service
metadata:
  name: erudition-landing
  namespace: erudition
  labels:
    app.kubernetes.io/name: erudition-landing
    app.kubernetes.io/part-of: erudition
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: erudition-landing
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
